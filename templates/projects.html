<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            padding: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 40px;
        }

        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #2a2a2a;
        }

        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .card p {
            color: #888;
            margin-bottom: 12px;
        }

        .tech {
            background: #2a2a2a;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
        }


        .back:hover { color: #fff; }
    </style>
</head>
<body>
    <h1>Projects</h1>
    <p class="subtitle">Things I have built</p>

    {% for project in projects %}
    <div class="card">
        <h2>{{ project.name }}</h2>
        <p>{{ project.description }}</p>
        <span class="tech">{{ project.tech }}</span>
    </div>
    {% endfor %}

    <a href="/" class="btn" style="text-decoration:none; padding: 10px 20px;">← Back to home</a><br>
    <a href="/add" class="btn" style="text-decoration:none; padding: 10px 20px;">+ Add Project</a>
</body>
</html>

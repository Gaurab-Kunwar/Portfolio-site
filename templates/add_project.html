<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        .btn {
            width: 100%;
            background: #fff;
            color: #0f0f0f;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn:hover { background: #ccc; }

        .back {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add Project</h1>
        <form method="POST">
            <label>Project Name</label>
            <input type="text" name="name" placeholder="e.g. Portfolio API">

            <label>Description</label>
            <input type="text" name="description" placeholder="What does it do?">

            <label>Tech Used</label>
            <input type="text" name="tech" placeholder="e.g. Python, Flask">

            <button type="submit" class="btn">Add Project</button>
        </form>
        <a href="/projects" class="back">← Back to projects</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurab Kunwar | Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .btn {
            background: #fff;
            color: #0f0f0f;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s ease, transform 0.1s ease;
            display: inline-block;
        }

        .btn:hover {
            background: #e0e0e0;
            transform: translateY(-1px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gaurab Kunwar</h1>
        <p>Python Developer · Building cool stuff</p>
        <!-- Using Jinja2 dynamic routing instead of a hardcoded path -->
        <a href="{{ url_for('get_projects_html') }}" class="btn">View Projects</a>
    </div>
</body>
</html>
